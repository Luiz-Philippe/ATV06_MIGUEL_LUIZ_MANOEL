    /* Função que carrega o tema livre do Luiz */
    function carregarTemaLuiz() {

        /* Injeta a estrutura HTML do tema de Jogos no PowerPoint */
        document.getElementById('conteudo').innerHTML = 
            '<div class="cartao-conteudo">' +
                '<div class="perfil-cabecalho">' +
                    '<img class="perfil-foto" src="img/pp.jpeg" alt="Capa do Tema Livre" title="Jogos no PowerPoint">' +
                    '<div class="perfil-dados">' +
                        '<h2 class="perfil-titulo">Guia Avançado de Desenvolvimento de Jogos no PPT</h2>' +
                        '<p class="secao-conteudo">Tema: Interatividade e Lógica em Ferramentas de Apresentação</p>' +
                        '<p class="secao-conteudo">Autor: Luiz Philippe</p>' +
                    '</div>' +
                '</div>' +
                '<div class="limpar-float"></div>' +
                '<hr>' +
                '<h3 class="secao-titulo">Introdução</h3>' +
                '<p class="secao-conteudo">A criação de jogos no PowerPoint baseia-se na transformação de uma ferramenta de apresentação linear em um ambiente interativo e lógico. Para desenvolver um projeto robusto, siga estas etapas fundamentais:</p>' +
                '<h3 class="secao-titulo">Mecânicas e Etapas Fundamentais</h3>' +
                '<p class="secao-conteudo"><strong>Navegação Não Linear e Hiperlinks:</strong> O núcleo de qualquer jogo no PPT é o sistema de navegação. Utilize Hiperlinks (Ctrl+K) em formas, imagens ou textos para direcionar o jogador a slides específicos (como telas de "Fase Concluída", "Game Over" ou ramificações da história). Isso permite que o usuário explore o ambiente em vez de apenas seguir uma sequência de slides.</p>' +
                '<p class="secao-conteudo"><strong>Controle de Fluxo e Segurança do Design:</strong> Para evitar que o jogo avance acidentalmente, é obrigatório ir até a guia Transições e desmarcar a opção "Ao Clicar com o Mouse". Isso "tranca" o slide, forçando o jogador a interagir exclusivamente com os botões e elementos que você programou.</p>' +
                '<p class="secao-conteudo"><strong>Mecânicas de Causa e Efeito com Gatilhos (Triggers):</strong> Utilize os Gatilhos localizados no painel de "Animação Avançada". Eles permitem que uma animação (como o surgimento de uma chave ou a explosão de um obstáculo) só aconteça quando um objeto específico for clicado. Isso é essencial para criar quebra-cabeças e menus interativos.</p>' +
                '<p class="secao-conteudo"><strong>Ocultação de Elementos e Lógica de Estado:</strong> Use o Painel de Seleção (Página Inicial > Selecionar > Painel de Seleção) para nomear cada objeto (ex: "Botão_Ataque", "Inimigo_01"). Isso facilita a organização de camadas e permite que você crie lógicas onde objetos aparecem ou desaparecem conforme a interação do jogador, simulando uma mudança de estado no jogo.</p>' +
                '<p class="secao-conteudo"><strong>Feedback Visual e Sonoro:</strong> Implemente animações de "Ênfase" para dar feedback imediato quando o jogador interagir com algo. Combine essas animações com a inserção de efeitos sonoros curtos nas configurações de animação para aumentar a imersão e indicar claramente acertos ou erros.</p>' +
                '<p class="secao-conteudo"><strong>Uso de Slides Mestres para Interface (UI):</strong> Para manter elementos constantes, como barras de vida, inventários ou botões de "Sair", configure-os no Slide Mestre. Isso garante que a interface do usuário seja replicada em todos os slides do jogo com precisão e economia de tempo no design.</p>' +
            '</div>';
    }
